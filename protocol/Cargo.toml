[package]
name = "vasak-connect-protocol"
description = "Shared D-Bus contract for the VasakOS Android device service"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json = "1"
# `zbus` es sólo del contrato de D-Bus (daemon↔paneles). El módulo `wire` no lo
# usa, así que queda detrás de la feature `dbus` (activa por omisión): la app
# móvil depende con `default-features = false` y se lleva sólo `wire`, sin zbus
# —que no compila en Android/iOS—.
zbus = { workspace = true, optional = true }

[features]
default = ["dbus"]
dbus = ["dep:zbus"]
