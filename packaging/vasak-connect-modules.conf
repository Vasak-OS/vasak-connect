# Loaded at boot rather than on demand.
#
# `modprobe` needs root, and this service runs in the session as the logged-in
# user. Asking for a polkit prompt to turn on a webcam would be a worse
# experience than the problem it solves, and a setuid helper for one module is
# not worth the attack surface.
#
# Loading it unconditionally is cheap because of `exclusive_caps=1` — see
# vasak-connect-v4l2loopback.conf. The cost is one idle device node.
v4l2loopback
