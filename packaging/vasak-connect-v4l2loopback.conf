# Options for the loopback device the phone camera is written into.
#
# `card_label` has to match `WEBCAM_CARD_LABEL` in protocol/src/lib.rs. The
# daemon looks the device up by name rather than by number, because /dev/videoN
# depends on how many real cameras the machine has and on the order the kernel
# probed them — on a laptop, video0 is the built-in webcam, and writing there
# would be writing over real hardware.
#
# `exclusive_caps=1` is the option that makes this feature acceptable to have
# loaded all the time: with it, the device only announces capture capability
# while something is actually writing frames into it. Without it, every browser
# and video call application lists "VasakOS Phone" as an available camera
# permanently, and shows black to anyone who picks it while no phone is
# streaming.
#
# `video_nr` is deliberately left at its default of -1 (the kernel chooses).
# Pinning a number is how you collide with whatever cameras the machine already
# has, and the lookup by label means nothing here needs to know the number.
options v4l2loopback devices=1 exclusive_caps=1 card_label="VasakOS Phone"
